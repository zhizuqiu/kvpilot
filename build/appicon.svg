<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1B2540"/>
      <stop offset="0.55" stop-color="#111829"/>
      <stop offset="1" stop-color="#0A0E18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.46" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#35E0C8" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#35E0C8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#35E0C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="key" x1="0.25" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#E6EDFC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>

  <!-- 钥匙环：青色，作为视觉锚点 -->
  <circle cx="345" cy="690" r="100" fill="none" stroke="#35E0C8" stroke-width="52"/>

  <!-- 钥匙杆 -->
  <line x1="430" y1="605" x2="745" y2="290" stroke="url(#key)" stroke-width="54" stroke-linecap="round"/>

  <!-- 箭头：两道后掠翼，暗示“领航/方向” -->
  <path d="M745 290 L713 428 M745 290 L607 322"
        fill="none" stroke="#FFFFFF" stroke-width="50"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 钥匙齿 -->
  <path d="M529 506 L487 464 M592 443 L550 401"
        fill="none" stroke="url(#key)" stroke-width="40" stroke-linecap="round"/>
</svg>
